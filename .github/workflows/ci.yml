name: CI

on:
  push:
    branches: ["**"]

jobs:
  build:
    if: endsWith(github.event.head_commit.message, '[trigger-cd]')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: macos-latest
            node: 22
          - os: windows-latest
            node: 22

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Circular-dep check
        run: npx madge --circular --extensions ts src

      - name: Built CLI smoke
        run: node test/cli-smoke.mjs

      - name: Offline retrieval-quality gate
        run: npm run eval

      - name: Package and cold-start gate
        run: npm run release:check
